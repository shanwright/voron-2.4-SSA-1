## Z0 Stepper - Front Left on MOTOR2_1
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs this to be set to 0
position_max: 340
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 1.1
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left on MOTOR3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 1.1
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on MOTOR4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 1.1
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z3 Stepper - Front Right on MOTOR5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 1.1
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

######################################################################
#     input shaper from BTT EBB36
######################################################################

[lis2dw]
cs_pin: EBB:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw
probe_points: 175, 175, 20 

[input_shaper]
shaper_type: mzv

#####################################################################
# 	Bed Heater
#####################################################################
[thermistor my_thermistor]
temperature1: 25
resistance1: 100000
beta: 3950

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA1
sensor_type: my_thermistor
sensor_pin: PF3
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.6
min_temp: 0
max_temp: 130

#####################################################################
# 	Probe
#####################################################################

#[beacon]
#serial: /dev/serial/by-id/usb-Beacon_Beacon_RevD_C621866D515137474C202020FF0C2A2B-if00
#x_offset: 0 # update with offset from nozzle on your machine
#y_offset: 20 # update with offset from nozzle on your machine
#contact_max_hotend_temperature: 180 # increase to probe at print temps
#home_xy_position: 175, 175 # update with your safe position
#home_z_hop: 5
#home_z_hop_speed: 30
#home_xy_move_speed: 300
#home_method: proximity # use proximity for induction homing
#home_method_when_homed: proximity # after initial calibration use induction
#home_autocalibrate: unhomed # contact will calibrate beacon on first home
#mesh_main_direction: x
#mesh_runs: 1

#####################################################################
# 	Fan Control
#####################################################################

#CPAP FAN
[fan]
pin: PG15
max_power: 1
# off_below: 0.16
cycle_time: .0002
# kick_start_time: 0.5

#HOTEND FAN
[heater_fan hotend_fan]
pin: EBB: PD3
heater: extruder
max_power: 1.0
kick_start_time: 0.5
heater_temp: 50
fan_speed: 1

# Control enclosure FAN 1
[heater_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
heater_temp: 25
fan_speed: 0.3

# Control enclosure FAN 2
[heater_fan exhaust_fan1]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 50
fan_speed: 0.7

# Control enclosure FAN 3
[heater_fan exhaust_fan2]
pin: PA8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 15
fan_speed: 0.3

#####################################################################
# 	Bed Mesh
#####################################################################

[bed_mesh]
speed: 700
horizontal_move_z: 10
##--------------------------------------------------------------------
mesh_min: 50, 50
mesh_max: 300,300
##--------------------------------------------------------------------
fade_start: 0.6
fade_end: 10.0
probe_count: 9,9 # Values should be odd, so one point is directly at bed center
algorithm: bicubic # relative_reference_index: 12 # Update when changing probe_count, to ((x points * y points) - 1) / 2. (the center point)
zero_reference_position=175,175

###########################################################
#    Add raspberry PI system temperature 
###########################################################
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 60

############################################################
#    Add Octopus MCU system temperature 
############################################################
[temperature_sensor octopus_mcu]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 60

############################################################
#   Add Enclosure temperature 
############################################################
[temperature_sensor Chamber]
sensor_type:EPCOS 100K B57560G104F 
sensor_pin: PF4 
min_temp: 10
max_temp: 80

#####################################################################
# 	LED Control
#####################################################################

#[output_pin caselight]
# Chamber Lighting - HE1 Connector (Optional)
#pin: PA3
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

#[safe_z_home]
#home_xy_position:175.000,175.000
#speed:100
#z_hop:3

[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
##	Probe points
points:
	50,25
	50,275
	300,275
	300,25
speed: 700
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.0075
max_adjust: 10


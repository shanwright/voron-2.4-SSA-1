[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: verbose                      # Valid Options are quiet/verbose/debug
delete_log: true                        # Cleans out file logs on boot to save space
no_proxy: false

[cam 1]
mode: ustreamer
enable_rtsp: false
port: 8080
device: /dev/v4l/by-id/usb-046d_C922_Pro_Stream_Webcam_3F9B837F-video-index0
resolution: 640x480                    
max_fps: 30                             # Forceful 30 FPS smooth motion streaming
custom_flags: --format=mjpeg            # Forces hardware compression to save USB lanes

[cam 2]
mode: ustreamer
enable_rtsp: false
port: 8081
device: /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920-video-index0
resolution: 640x480                     
max_fps: 30                             # Forceful 30 FPS smooth motion streaming
custom_flags: --format=mjpeg            # Forces hardware compression to save USB lanes

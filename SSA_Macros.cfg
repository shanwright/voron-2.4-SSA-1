[gcode_macro HOME_X]
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.7 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F1200
    
    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro HOME_Y]
gcode:
    # Set current for sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.7 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 Y
    # Move away
    G91
    G1 Y-10 F1200

    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}


[gcode_macro M0] 
gcode: pause

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro PURGE_LINE]
gcode:
    G92 E0                         ; Reset Extruder
    G90                            ; Use absolute coordinates
    # Move to start position
    G1 X5 Y5 Z0.3 F5000.0          ; Move to front-left corner
    # Draw the first line
    G1 X5 Y150.0 Z0.3 F1500.0 E15  ; Draw a 145mm line
    # Move to side and draw back
    G1 X5.4 Y150.0 Z0.3 F5000.0    ; Move to side
    G1 X5.4 Y5 Z0.3 F1500.0 E30    ; Draw second line back
    G92 E0                         ; Reset Extruder again
    G1 Z2.0 F3000                  ; Lift nozzle to prevent scratching
    

[gcode_macro GANTRY_LEVEL]
gcode:
    QUAD_GANTRY_LEVEL
       
[gcode_macro PRINT_START]
gcode:    
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0.00
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor Enable=0
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(150)|float %}
    M104 S150                               ; preheat nozzle to probing temp
    M140 S{BED}                             ; start bed heater
    {% if "xyz" not in printer.toolhead.homed_axes %}
    G28 METHOD=PROXIMITY
    {% endif %}
    WIPE_NOZZLE
    M190 S{BED}                             ; wait on bed temperature
    G28 Z METHOD=PROXIMITY
    QUAD_GANTRY_LEVEL
    BED_MESH_CALIBRATE RUNS=1               ; bed mesh in scan mode
    WIPE_NOZZLE
    G28 Z METHOD=CONTACT CALIBRATE=0    
    G1 Z10 F3000                            ; move to 10 in the Z
    M104 S{EXTRUDER}                        ; set extruder to print temp
    M109 S{EXTRUDER}                        ; wait for extruder temp
    PURGE_LINE
    G1 Z10 F3000
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor Enable=1
    SKEW_PROFILE LOAD=my_skew_profile
    #SET_GCODE_OFFSET Z=0.06                ; add a little offset for hotend thermal expansion
    #SET_GCODE_OFFSET Z_ADJUST={OFFSET}      ; apply optional material squish via slicer

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-15.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z10.00 X20.0 Y20.0 F20000   ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z10 F3000                   ; move nozzle up 10mm
    G90                            ; absolute positioning
    G0  X10 Y340 F3600             ; park nozzle in the left back corner
    SET_SKEW CLEAR=1
    
[gcode_macro WIPE_NOZZLE]
variable_start_x: 303
variable_start_y: 357
variable_start_z: 3.5
variable_wipe_dist: -40
variable_wipe_qty: 6
variable_wipe_spd: 180
variable_raise_distance: 20

gcode:
 # {% set BED = params.BED|default(60)|float %}
 # {% set EXTRUDER = params.EXTRUDER|default(150)|float %}
 # M104 S150                               ; preheat nozzle to probing temp
 # M140 S{BED}                             ; start bed heater
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28 METHOD=PROXIMITY
 {% endif %}
 
 G90 ; absolute positioning
 ## Move nozzle to start position
 G1 Z{raise_distance} F1500
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1500

 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}

 ## Raise nozzle
 G1 Z{raise_distance}    
# SSA RED Voron2.4
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[include mainsail.cfg]
[include fluidd.cfg]
[include shaketune.cfg]
[include config_backup.cfg]
[include SSA_Macros.cfg]
[include btt_sfs.cfg]
[include beacon.cfg]
[include bedfans.cfg]
[exclude_object]
[gcode_arcs]
resolution: 0.1

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_20001D000750534E4E313120-if00
restart_method: command

[mcu EBB]
serial:/dev/serial/by-id/usb-Klipper_stm32g0b1xx_3F001F000450315741363420-if00 #the id for the Gen 2 EBB36 v1.0
#canbus_uuid: 7b4c700d6e67 #the uuid for the EBB36 v1.2

[extruder]
step_pin: EBB: PB14
dir_pin: EBB: PA8
enable_pin: !EBB: PB6
microsteps: 16
rotation_distance: 5.565
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.03
max_extrude_only_distance: 101
heater_pin: EBB: PB4
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: EBB: PA3
min_temp: 10
max_temp: 280
max_power: 1.0
min_extrude_temp: 170
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: EBB: PB3
run_current: 0.450
sense_resistor: 0.11
stealthchop_threshold: 0

[printer]
kinematics: corexy
max_velocity: 700 
max_accel: 10000    			#Max 4000
max_z_velocity: 30 			    #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on MOTOR0(B Motor)
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop # endstop_pin: PG6
position_min: 0
position_endstop: 350
position_max: 350
homing_speed:40    #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 1.1
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG6
driver_SGTHRS: 100

## Y Stepper on MOTOR1 (A Motor)
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2209_stepper_y:virtual_endstop #endstop_pin: !PG1
position_min: 0
position_endstop: 359
position_max: 359
homing_speed: 40  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 1.1
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PG9
driver_SGTHRS: 100 # 255 is most sensitive value, 0 is least sensitive
 
#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR2_1
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs this to be set to 0
position_max: 340
position_min: -5
homing_speed: 8
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: True
run_current: 1.1
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left on MOTOR3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: True
run_current: 1.1
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on MOTOR4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: True
run_current: 1.1
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z3 Stepper - Front Right on MOTOR5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: True
run_current: 1.1
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

######################################################################
#     input shaper from BTT EBB36
######################################################################

[lis2dw]
cs_pin: EBB:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw
probe_points: 175, 175, 20 

[input_shaper]
shaper_type: mzv

#####################################################################
# 	Bed Heater
#####################################################################
[thermistor my_thermistor]
temperature1: 25
resistance1: 100000
beta: 3950

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA1
sensor_type: my_thermistor
sensor_pin: PF3
max_power: 0.8
min_temp: 0
max_temp: 130

#####################################################################
# 	Fan Control
#####################################################################

#CPAP FAN
[fan]
pin: PG15
max_power: 1
# off_below: 0.16
cycle_time: .0002
# kick_start_time: 0.5

#HOTEND FAN
[heater_fan hotend_fan]
pin: EBB: PD3
heater: extruder
max_power: 1.0
kick_start_time: 0.5
heater_temp: 50
fan_speed: 1

# Control enclosure FAN 1
[heater_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
heater_temp: 25
fan_speed: 0.3

# Control enclosure FAN 2
[heater_fan exhaust_fan1]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 50
fan_speed: 0.7

# Control enclosure FAN 3
[heater_fan exhaust_fan2]
pin: PA8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 15
fan_speed: 0.3

#####################################################################
# 	Bed Mesh
#####################################################################
[bed_mesh]
speed: 700
horizontal_move_z: 10
mesh_min: 40, 40
mesh_max: 320,320
zero_reference_position: 175,175
fade_start: 0.6
fade_end: 10.0
probe_count: 25,25 # Values should be odd, so one point is directly at bed center
algorithm: bicubic # relative_reference_index: 12 # Update when changing probe_count, to ((x points * y points) - 1) / 2. (the center point)

###########################################################
#    Add raspberry PI system temperature 
###########################################################
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 60

############################################################
#    Add Octopus MCU system temperature 
############################################################
[temperature_sensor octopus_mcu]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 60

############################################################
#   Add Chamber temperature 
############################################################
[temperature_sensor Chamber]
sensor_type:EPCOS 100K B57560G104F 
sensor_pin: PF4 
min_temp: 10
max_temp: 80

###########################################################################
#    EBB36 Gen 2 MCU temperature
###########################################################################

[temperature_sensor EBB36_MCU]
sensor_type: temperature_mcu
sensor_mcu: EBB                     # Monitors the actual internal STM32 processor

#####################################################################
# 	LED Control
#####################################################################

#[output_pin caselight]
# Chamber Lighting - HE1 Connector (Optional)
#pin: PA3
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
##	Probe points
points:
	50,25
	50,275
	300,275
	300,25
speed: 700
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.0075
max_adjust: 10

